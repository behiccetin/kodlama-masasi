<!DOCTYPE html>
<html lang="tr" data-theme="masa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Kodlama Masası</title>
<meta name="description" content="Görüşme ve metin verisi için tarayıcıda çalışan, kurulumsuz, ücretsiz nitel kodlama aracı.">
<style>/*__CSS__*/</style>
</head>
<body class="bg-base-200 text-base-content">

<div id="sekmeUyari" class="hidden alert alert-warning rounded-none justify-center text-sm"><span data-t="otherTab"></span><button class="btn btn-sm" id="yenile" data-t="reload"></button></div>

<div class="drawer lg:drawer-open" id="cekmece">
  <input id="yan-menu" type="checkbox" class="drawer-toggle">
  <div class="drawer-content flex flex-col h-screen min-w-0">

    <header class="navbar min-h-14 bg-base-100 border-b border-base-300 gap-2 px-3 yazdirma">
      <div class="flex items-center gap-1 min-w-0 flex-1">
        <label for="yan-menu" class="btn btn-ghost btn-sm btn-square lg:hidden" data-ta="menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </label>
        <button class="btn btn-ghost btn-sm btn-square" data-sekme="giris" data-ta="tabHome" id="evBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
        <input id="projeAd" class="input input-ghost input-sm font-semibold text-base w-full min-w-28 max-w-72" data-ta="projectName">
        <span id="korRozet" class="badge badge-warning badge-sm hidden whitespace-nowrap" data-t="blindOn"></span>
        <span id="kayitDurum" class="text-xs text-base-content/50 hidden xl:inline whitespace-nowrap"></span>
      </div>
      <nav class="hidden md:flex">
        <div role="tablist" class="tabs tabs-box tabs-sm" id="sekmeler">
          <button role="tab" class="tab" data-sekme="kod" data-t="tabCode"></button>
          <button role="tab" class="tab" data-sekme="alinti" data-t="tabQuotes"></button>
          <button role="tab" class="tab" data-sekme="analiz" data-t="tabAnalysis"></button>
          <button role="tab" class="tab" data-sekme="uyum" data-t="tabAgreement"></button>
          <button role="tab" class="tab" data-sekme="rapor" data-t="tabReport"></button>
        </div>
      </nav>
      <div class="flex items-center gap-1 flex-1 justify-end">
        <div class="join">
          <button class="btn btn-ghost btn-sm btn-square join-item" id="geriAl" data-ta="undo" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
          <button class="btn btn-ghost btn-sm btn-square join-item" id="yinele" data-ta="redo" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
        </div>
        <div class="dropdown dropdown-end hidden sm:block">
          <button tabindex="0" class="btn btn-ghost btn-sm max-w-44 flex-nowrap" id="kodlayiciBtn"></button>
          <div tabindex="0" class="dropdown-content z-40 mt-2 w-80 rounded-box bg-base-100 border border-base-300 p-4 shadow-lg space-y-3">
            <div><div class="flex items-center gap-1"><label class="text-sm font-medium" for="kodlayiciAd" data-t="coderYou"></label><span data-ip="kodlayici"></span></div>
              <input id="kodlayiciAd" class="input input-sm w-full mt-1"></div>
            <div><label class="text-sm font-medium" for="gorunur" data-t="showCoders"></label>
              <select id="gorunur" class="select select-sm w-full mt-1"></select></div>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="toggle toggle-sm" id="korSec"><span data-t="blindLabel"></span><span data-ip="kor"></span></label>
            <button class="btn btn-sm btn-block" data-arac="kodlayicilar" data-t="toolCoders"></button>
          </div>
        </div>
        <select id="dilSec" class="select select-sm w-28 hidden sm:inline-flex" data-ta="language"></select>
        <label class="swap swap-rotate btn btn-ghost btn-sm btn-square" data-ta="theme">
          <input type="checkbox" id="temaSec" class="theme-controller" value="masa-gece">
          <svg class="swap-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="swap-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </label>
        <button class="btn btn-ghost btn-sm btn-square" id="genelYardim" data-ta="help">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button>
        <div class="dropdown dropdown-end">
          <button tabindex="0" class="btn btn-sm btn-neutral" data-t="project"></button>
          <ul tabindex="0" class="dropdown-content menu z-40 mt-2 w-80 rounded-box bg-base-100 border border-base-300 p-2 shadow-lg">
            <li class="sm:hidden"><label class="flex flex-col items-start gap-1"><span class="text-xs" data-t="coderYou"></span><input id="kodlayiciAdM" class="input input-xs w-full"></label></li>
            <li class="sm:hidden"><label class="flex flex-col items-start gap-1"><span class="text-xs" data-t="language"></span><select id="dilSecM" class="select select-xs w-full"></select></label></li>
            <li class="menu-title" data-t="menuFile"></li>
            <li><button data-arac="yeni" data-t="newProject"></button></li>
            <li><button data-arac="ac" data-t="openProject"></button></li>
            <li><button data-arac="kaydet" data-t="saveProject"></button></li>
            <li><button data-arac="ornek" data-t="loadSample"></button></li>
            <li><button data-arac="qdpxVer" data-t="qdpxExport"></button></li>
            <li><button data-arac="qdpxAl" data-t="qdpxImport"></button></li>
            <li class="menu-title" data-t="menuTools"></li>
            <li><button data-arac="ara" data-t="toolSearch"></button></li>
            <li><button data-arac="anonim" data-t="toolAnon"></button></li>
            <li><button data-arac="ozellik" data-t="toolAttr"></button></li>
            <li><button data-arac="kodlayicilar" data-t="toolCoders"></button></li>
            <li><button data-arac="ikinci" data-t="toolSecond"></button></li>
            <li><button data-arac="gunluk" data-t="toolLog"></button></li>
            <li class="menu-title" data-t="languageFiles"></li>
            <li><button data-arac="dilSablon" data-t="langTemplate"></button></li>
            <li><button data-arac="dilYukle" data-t="langLoad"></button></li>
          </ul>
        </div>
      </div>
    </header>

    <div class="md:hidden bg-base-100 border-b border-base-300 px-2 py-2 overflow-x-auto yazdirma">
      <div role="tablist" class="tabs tabs-box tabs-xs w-max" id="sekmelerMobil"></div>
    </div>

    <main class="flex-1 min-h-0 overflow-auto flex flex-col">
      <!-- ANA SAYFA -->
      <section id="s-giris" class="sekme hidden"></section>
      <!-- KODLAMA -->
      <section id="s-kod" class="sekme xl:flex-1 xl:min-h-0">
        <div class="grid xl:h-full xl:grid-cols-[minmax(0,1fr)_21rem]">
          <div class="min-w-0 xl:overflow-auto" id="okuyucuKap">
            <div class="max-w-5xl mx-auto px-3 sm:px-6 pt-5 pb-16">
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-3">
                <h1 id="belgeBaslik" class="text-xl font-semibold truncate"></h1>
                <span id="belgeOzet" class="text-sm text-base-content/60"></span>
                <span data-ip="okuyucu"></span>
                <button class="btn btn-sm btn-ghost ml-auto" data-arac="ara">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-t="toolSearch"></span></button>
              </div>
              <div class="relative bg-base-100 border border-base-300 rounded-box py-7 pr-5 sm:pr-10 grid grid-cols-[2.25rem_minmax(0,1fr)] md:grid-cols-[11rem_minmax(0,1fr)]">
                <div id="serit" class="relative" aria-hidden="true"></div>
                <div id="okuyucu" class="okuyucu metin-serif pl-3"></div>
              </div>
            </div>
          </div>
          <aside id="ayrinti" class="bg-base-100 xl:border-l border-base-300 xl:overflow-auto p-5 border-t xl:border-t-0"></aside>
        </div>
      </section>

      <!-- ALINTILAR -->
      <section id="s-alinti" class="sekme hidden p-4 sm:p-6">
        <div class="max-w-6xl mx-auto grid gap-6 lg:grid-cols-[16rem_minmax(0,1fr)]">
          <div class="space-y-3">
            <h2 class="font-semibold" data-t="filters"></h2>
            <fieldset class="fieldset py-0"><legend class="fieldset-legend"><span data-t="search"></span><span data-ip="fAra"></span></legend><input id="fAra" class="input input-sm w-full" type="search"></fieldset>
            <fieldset class="fieldset py-0"><legend class="fieldset-legend" data-t="document"></legend><select id="fBelge" class="select select-sm w-full"></select></fieldset>
            <fieldset class="fieldset py-0"><legend class="fieldset-legend"><span data-t="attribute"></span><span data-ip="fOzellik"></span></legend><select id="fOzellik" class="select select-sm w-full"></select></fieldset>
            <fieldset class="fieldset py-0"><legend class="fieldset-legend" data-t="coder"></legend><select id="fKodlayici" class="select select-sm w-full"></select></fieldset>
            <fieldset class="fieldset py-0">
              <legend class="fieldset-legend"><span data-t="codes"></span><span data-ip="fKodlar"></span></legend>
              <label class="label text-sm"><input id="fAlt" type="checkbox" class="checkbox checkbox-sm" checked> <span data-t="includeSub"></span></label>
              <div id="fKodlar" class="max-h-80 overflow-auto space-y-1 mt-1"></div>
              <div class="flex gap-2 mt-2"><button class="btn btn-xs" id="fHepsi" data-t="selectAll"></button><button class="btn btn-xs" id="fHicbiri" data-t="selectNone"></button></div>
            </fieldset>
          </div>
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-3">
              <h2 id="alintiSayi" class="font-semibold"></h2><span data-ip="alintiListe"></span>
              <span class="flex-1"></span>
              <button class="btn btn-sm" id="alintiKopya" data-t="copyText"></button>
              <button class="btn btn-sm" id="alintiCsv" data-t="exportCsv"></button>
            </div>
            <ul id="alintiListe" class="space-y-3"></ul>
          </div>
        </div>
      </section>

      <!-- ANALİZ -->
      <section id="s-analiz" class="sekme hidden p-4 sm:p-6">
        <div class="max-w-6xl mx-auto space-y-10">
          <div><div class="flex items-center gap-1 mb-3"><h2 class="text-lg font-semibold" data-t="tabAnalysis"></h2><span data-ip="istat"></span></div>
            <div id="ozetIstat" class="stats stats-vertical sm:stats-horizontal bg-base-100 border border-base-300 w-full"></div></div>
          <div class="grid gap-8 lg:grid-cols-2">
            <div class="min-w-0"><div class="flex items-center gap-1 mb-2"><h3 class="font-semibold" data-t="codeFreq"></h3><span data-ip="frekans"></span></div>
              <div class="overflow-x-auto bg-base-100 border border-base-300 rounded-box"><table class="table table-sm" id="frekans"></table></div></div>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-2"><h3 class="font-semibold" data-t="wordFreq"></h3><span data-ip="kelime"></span><span class="flex-1"></span>
                <label class="label text-xs"><input id="kelimeGor" type="checkbox" class="checkbox checkbox-xs" checked> <span data-t="skipInterviewer"></span></label>
                <select id="kelimeKapsam" class="select select-xs w-auto"></select></div>
              <div id="kelimeler" class="bg-base-100 border border-base-300 rounded-box p-4"></div>
            </div>
          </div>
          <div class="min-w-0"><div class="flex items-center gap-1 mb-2"><h3 class="font-semibold" data-t="codeMap"></h3><span data-ip="harita"></span><span class="flex-1"></span><button class="btn btn-xs" id="haritaIndir" data-t="downloadSvg"></button></div>
            <div id="harita" class="overflow-x-auto bg-base-100 border border-base-300 rounded-box p-2"></div></div>
          <div class="min-w-0"><div class="flex items-center gap-1 mb-2"><h3 class="font-semibold" data-t="codeDocMatrix"></h3><span data-ip="matris"></span></div>
            <div class="overflow-x-auto bg-base-100 border border-base-300 rounded-box"><table class="table table-xs" id="matris"></table></div></div>
          <div class="min-w-0"><div class="flex items-center gap-1 mb-2"><h3 class="font-semibold" data-t="cooc"></h3><span data-ip="esgorunum"></span></div>
            <div class="overflow-x-auto bg-base-100 border border-base-300 rounded-box"><table class="table table-xs" id="esgorunum"></table></div></div>
        </div>
      </section>

      <!-- UYUM -->
      <section id="s-uyum" class="sekme hidden p-4 sm:p-6">
        <div class="max-w-6xl mx-auto space-y-6">
          <div><h2 class="text-lg font-semibold" data-t="tabAgreement"></h2>
            <p class="text-sm text-base-content/70 max-w-3xl mt-1" data-t="agreeIntro"></p></div>
          <div class="flex flex-wrap items-end gap-4 bg-base-100 border border-base-300 rounded-box p-4">
            <fieldset class="fieldset py-0"><legend class="fieldset-legend" data-t="coderA"></legend><select id="uA" class="select select-sm"></select></fieldset>
            <fieldset class="fieldset py-0"><legend class="fieldset-legend" data-t="coderB"></legend><select id="uB" class="select select-sm"></select></fieldset>
            <fieldset class="fieldset py-0"><legend class="fieldset-legend"><span data-t="unit"></span><span data-ip="uyumBirim"></span></legend><select id="uBirim" class="select select-sm"></select></fieldset>
            <span class="flex-1"></span>
            <div class="flex items-center gap-1"><button class="btn btn-sm" id="uBirlestir" data-t="mergeCoder"></button><span data-ip="birlestir"></span></div>
          </div>
          <div id="uSonuc"></div>
          <div id="uAlfa"></div>
        </div>
      </section>

      <!-- RAPOR -->
      <section id="s-rapor" class="sekme hidden p-4 sm:p-6">
        <div class="max-w-3xl mx-auto space-y-6">
          <h2 class="text-lg font-semibold" data-t="tabReport"></h2>
          <div class="bg-base-100 border border-base-300 rounded-box p-5 space-y-3">
            <div class="flex items-center gap-1"><h3 class="font-semibold" data-t="wordReport"></h3><span data-ip="rWord"></span></div>
            <p class="text-sm text-base-content/70" data-t="wordReportHint"></p>
            <div class="grid sm:grid-cols-2 gap-1">
              <label class="label text-sm"><input type="checkbox" class="checkbox checkbox-sm" id="rKitap" checked> <span data-t="codebook"></span></label>
              <label class="label text-sm"><input type="checkbox" class="checkbox checkbox-sm" id="rFrekans" checked> <span data-t="codeFreq"></span></label>
              <label class="label text-sm"><input type="checkbox" class="checkbox checkbox-sm" id="rMatris" checked> <span data-t="codeDocMatrix"></span></label>
              <label class="label text-sm"><input type="checkbox" class="checkbox checkbox-sm" id="rAlinti" checked> <span data-t="quotesByCode"></span></label>
              <label class="label text-sm"><input type="checkbox" class="checkbox checkbox-sm" id="rUyum" checked> <span data-t="tabAgreement"></span></label>
              <label class="label text-sm"><input type="checkbox" class="checkbox checkbox-sm" id="rGunluk" checked> <span data-t="projectLog"></span></label>
              <label class="label text-sm"><input type="checkbox" class="checkbox checkbox-sm" id="rNot"> <span data-t="memos"></span></label>
              <label class="label text-sm"><input type="checkbox" class="checkbox checkbox-sm" id="rYontem" checked> <span data-tg="yontem.rapor"></span></label>
            </div>
            <label class="text-sm flex items-center gap-2"><span data-t="maxQuotes"></span> <input type="number" id="rEnFazla" class="input input-sm w-20" value="5" min="1" max="99"></label>
            <button class="btn btn-primary" id="rWord" data-t="downloadWord"></button>
          </div>
          <div class="bg-base-100 border border-base-300 rounded-box p-5">
            <div class="flex flex-wrap items-center gap-2"><h3 class="font-semibold flex-1" data-tg="yontem.baslik"></h3><button class="btn btn-sm" id="yontemKopya" data-tg="yontem.kopyala"></button><button class="btn btn-sm btn-ghost" data-arac="atif" data-tg="atif.dugme"></button></div>
            <p class="text-xs text-base-content/60 mt-1" data-tg="yontem.not"></p>
            <div id="yontemKart" class="mt-4 border-l-4 border-primary pl-4"></div>
          </div>
          <div class="bg-base-100 border border-base-300 rounded-box p-5 space-y-3">
            <h3 class="font-semibold" data-t="dataFiles"></h3>
            <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
              <span class="inline-flex items-center gap-1"><button class="btn btn-sm" id="rCsv" data-t="segmentsCsv"></button><span data-ip="rCsv"></span></span>
              <span class="inline-flex items-center gap-1"><button class="btn btn-sm" id="rKitapCsv" data-t="codebookCsv"></button><span data-ip="rKitapCsv"></span></span>
              <span class="inline-flex items-center gap-1"><button class="btn btn-sm" data-arac="kaydet" data-t="saveProject"></button><span data-ip="rProje"></span></span>
              <span class="inline-flex items-center gap-1"><button class="btn btn-sm" data-arac="qdpxVer" data-t="qdpxExport"></button><span data-ip="qdpx"></span></span>
            </div>
          </div>
        </div>
      </section>

      <footer class="mt-auto text-xs text-base-content/60 px-4 sm:px-6 py-3 border-t border-base-300 bg-base-100 yazdirma">
        <p data-t="privacy"></p>
        <p class="mt-1"><b>Kodlama Masası</b> v2.0.1. <span data-t="credit"></span> <b>Öğr. Gör. Dr. Behiç ÇETİN</b>. © 2026, <span data-t="license"></span>. DOI: <a class="link" href="https://doi.org/10.5281/zenodo.24248757" target="_blank" rel="noopener noreferrer">10.5281/zenodo.24248757</a></p>
      </footer>
    </main>
  </div>

  <div class="drawer-side z-40">
    <label for="yan-menu" class="drawer-overlay" data-ta="close"></label>
    <aside class="bg-base-100 border-r border-base-300 min-h-full w-72 flex flex-col">
      <div class="px-4 h-14 flex items-center gap-2 border-b border-base-300 cursor-pointer" data-sekme="giris" title="Kodlama Masası">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="20" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12h10M8 17h7M8 22h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="21" y="3" width="6" height="18" rx="2" transform="rotate(25 24 12)" fill="#F5C518"/></svg>
        <span class="font-semibold">Kodlama Masası</span>
      </div>
      <div class="p-3">
        <div class="flex items-center gap-1 px-1">
          <h2 class="text-sm font-semibold" data-t="documents"></h2><span data-ip="belgeler"></span>
          <button class="btn btn-ghost btn-xs ml-auto" id="belgeEkle">+ <span data-t="add"></span></button>
        </div>
        <ul id="belgeListe" class="menu menu-sm w-full p-0 mt-1"></ul>
      </div>
      <div class="p-3 border-t border-base-300 flex-1">
        <div class="flex items-center gap-1 px-1" id="kodKok">
          <h2 class="text-sm font-semibold" data-t="codes"></h2><span data-ip="kodlar"></span>
          <button class="btn btn-ghost btn-xs ml-auto" id="kodEkle">+ <span data-t="add"></span></button>
        </div>
        <input id="kodAra" type="search" class="input input-xs w-full mt-2" data-tp="filterCodes">
        <div id="kokBirak" class="hidden h-6 leading-5 text-xs text-center border border-dashed border-primary rounded-field mt-2 truncate px-2" data-t="dropRoot"></div>
        <ul id="kodAgac" class="menu menu-sm w-full p-0 mt-1"></ul>
      </div>
    </aside>
  </div>
</div>

<div id="kodKutu" class="kutu-acilir hidden bg-base-100 border border-base-300 rounded-box shadow-xl p-2" role="dialog">
  <input id="kkAra" class="input input-sm w-full" autocomplete="off" data-tp="codeOrNew">
  <ul id="kkListe" class="menu menu-sm w-full p-0 mt-1 max-h-64 overflow-auto flex-nowrap"></ul>
  <p class="text-xs text-base-content/60 px-1 pt-1" data-t="quickKeys"></p>
</div>

<dialog id="pencere" class="modal">
  <div class="modal-box max-w-2xl">
    <div class="flex items-center gap-1"><h3 id="pBaslik" class="font-semibold text-lg"></h3><span id="pYardim"></span></div>
    <div id="pIcerik" class="mt-4"></div>
    <div id="pDugmeler" class="modal-action"></div>
  </div>
  <form method="dialog" class="modal-backdrop"><button data-ta="close">x</button></form>
</dialog>

<div id="ipucuKutu" class="hidden fixed z-[70] w-72 max-w-[calc(100vw-1rem)] rounded-box bg-base-100 border border-base-300 shadow-xl p-3 text-sm leading-relaxed ipucu-metin" role="tooltip"></div>
<div id="tost" class="toast toast-end toast-bottom z-50"></div>
<input type="file" id="dosyaSec" class="hidden">

<script>//__PDFJS__</script>
<script>
"use strict";
const GOMULU_DILLER=/*__DILLER__*/{};
//__JS__
</script>
</body>
</html>
